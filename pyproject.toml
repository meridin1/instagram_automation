
[project]
name = "meridin-instagram"
version = "3.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "motor>=3.7,<4",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "httpx>=0.28,<1",
    "python-dotenv>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "PyJWT>=2.10,<3",
    "pwdlib[argon2]>=0.2,<1",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
    "numpy>=1.26,<3",
    "email-validator>=2.2,<3",
    "cryptography>=44,<46",
    "boto3>=1.35,<2",
]

[tool.vercel]
entrypoint = "main:app"
