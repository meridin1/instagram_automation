<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meridin Admin</title><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#172018;background:#f4f7f4}*{box-sizing:border-box}body{margin:0}.top{background:#101a13;color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.12em}.wrap{max-width:1250px;margin:24px auto;padding:0 16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.two{grid-template-columns:1fr 1fr}.card{background:#fff;border:1px solid #e0e7e0;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 3px 15px #00000008}.metric{font-size:30px;font-weight:800}.muted{color:#687168;font-size:13px}input,textarea{width:100%;padding:10px;border:1px solid #ccd6cc;border-radius:8px;margin:6px 0 12px;font:inherit}button{border:0;border-radius:8px;background:#167a3b;color:#fff;padding:10px 14px;cursor:pointer;margin:4px 4px 4px 0}.danger{background:#a73737}.secondary{background:#59645c}.hidden{display:none}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #edf0ed;text-align:left;vertical-align:top}pre{white-space:pre-wrap;background:#f0f3f0;padding:12px;border-radius:8px;max-height:300px;overflow:auto}.status{padding:10px;border-radius:8px;background:#edf7ef;margin-bottom:14px}@media(max-width:850px){.grid,.two{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid,.two{grid-template-columns:1fr}}
</style></head><body><div class="top"><div class="brand">MERIDIN / ADMIN</div><button class="secondary" onclick="logout()">Logout</button></div><div class="wrap">
<div id="login" class="card"><h2>Admin login</h2><p class="muted">Use the ADMIN_EMAIL and ADMIN_PASSWORD configured in the server environment.</p><input id="email" placeholder="Admin email"><input id="password" type="password" placeholder="Admin password"><button onclick="login()">Login</button><pre id="loginOut"></pre></div>
<div id="app" class="hidden"><div id="status" class="status">Connected</div><div class="grid" id="metrics"></div>
<div class="card"><h2>Clients</h2><button class="secondary" onclick="loadAll()">Refresh</button><div style="overflow:auto"><table><thead><tr><th>Brand</th><th>Email</th><th>Instagram</th><th>Status</th><th>Connection</th><th>Actions</th></tr></thead><tbody id="clients"></tbody></table></div></div>
<div class="card"><h2>Add client</h2><div class="grid two"><div><input id="brand" placeholder="Brand name"><input id="cemail" placeholder="Email"><input id="cpassword" type="password" placeholder="Password (8+)" required><input id="ig" placeholder="Instagram username"></div><div><input id="location" placeholder="Location"><input id="delivery" placeholder="Delivery information"><input id="hours" placeholder="Business hours"><input id="language" value="English" placeholder="Language"><input id="tone" value="Friendly" placeholder="Tone"></div></div><textarea id="info" placeholder="Business information"></textarea><label><input id="auto" type="checkbox" checked> Automation enabled</label> <label><input id="llm" type="checkbox"> LLM fallback enabled</label><br><button onclick="createClient()">Create client</button><pre id="createOut"></pre></div>
</div></div><script>
const api=(p,o={})=>fetch(p,{...o,headers:{...(o.headers||{}),...(o.body&&!(o.body instanceof URLSearchParams)?{'Content-Type':'application/json'}:{}),...(localStorage.adminToken?{Authorization:'Bearer '+localStorage.adminToken}:{})}});const j=async r=>{const x=await r.json();if(!r.ok)throw Error(x.detail||JSON.stringify(x));return x};
async function login(){try{const r=await j(await api('/api/auth/login',{method:'POST',body:new URLSearchParams({username:email.value,password:password.value})}));localStorage.adminToken=r.access_token;await boot()}catch(e){loginOut.textContent=e.message}}
async function boot(){if(!localStorage.adminToken)return;try{const me=await j(await api('/api/admin/me'));if(me.role!=='admin')throw Error('This account is not an admin');login.classList.add('hidden');app.classList.remove('hidden');await loadAll()}catch(e){localStorage.removeItem('adminToken');login.classList.remove('hidden');loginOut.textContent=e.message}}
async function loadAll(){try{const [s,c]=await Promise.all([j(await api('/api/admin/stats')),j(await api('/api/admin/clients'))]);metrics.innerHTML=Object.entries(s).map(([k,v])=>`<div class="card"><div class="muted">${esc(k.replaceAll('_',' '))}</div><div class="metric">${v}</div></div>`).join('');clients.innerHTML=c.map(x=>`<tr><td><b>${esc(x.name)}</b><br><span class="muted">${x.id}</span></td><td>${esc((x.users||[]).find(u=>u.role==='owner')?.email||'')}</td><td>${esc(x.instagram_username||'—')}</td><td>${x.active===false?'Disabled':'Active'}</td><td>${x.instagram_connected?'Connected':'Not connected'}</td><td>${x.active===false?`<button onclick="enable('${x.id}')">Enable</button>`:`<button class="secondary" onclick="disable('${x.id}')">Disable</button>`}<button class="danger" onclick="removeClient('${x.id}','${esc(x.name)}')">Delete</button></td></tr>`).join('')}catch(e){status.textContent=e.message}}
async function createClient(){try{const x=await j(await api('/api/admin/clients',{method:'POST',body:JSON.stringify({brand_name:document.getElementById('brand').value,email:document.getElementById('cemail').value,password:document.getElementById('cpassword').value,instagram_username:document.getElementById('ig').value,business_information:document.getElementById('info').value,location:document.getElementById('location').value,delivery_information:document.getElementById('delivery').value,business_hours:document.getElementById('hours').value,language:document.getElementById('language').value,tone:document.getElementById('tone').value,automation_enabled:document.getElementById('auto').checked,llm_enabled:document.getElementById('llm').checked})}));createOut.textContent=JSON.stringify(x,null,2);await loadAll()}catch(e){createOut.textContent=e.message}}
async function disable(id){if(!confirm('Disable this client? Automation will stop.'))return;await j(await api('/api/admin/clients/'+id+'/disable',{method:'POST'}));loadAll()}
async function enable(id){await j(await api('/api/admin/clients/'+id+'/enable',{method:'POST'}));loadAll()}
async function removeClient(id,name){if(!confirm('PERMANENTLY delete this client and all of its data?'))return;if(!confirm('This cannot be undone. Continue?'))return;await j(await api('/api/admin/clients/'+id,{method:'DELETE'}));loadAll()}
function logout(){localStorage.removeItem('adminToken');location.reload()}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}boot();
</script></body></html>
